{% extends "base.html" %}
{% block titulo %}Setores{% endblock %}
{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Setores</h1>
  <a class="btn btn-primary" href="{{ url_for('setores.novo') }}">Novo setor</a>
</div>
<table class="table table-hover align-middle">
  <thead class="table-light"><tr><th>Sigla</th><th>Nome</th><th></th><th class="text-end">Ações</th></tr></thead>
  <tbody>
  {% for s in setores %}
    <tr>
      <td>{{ s.sigla }}</td>
      <td>{{ s.nome }}</td>
      <td>{% if s.eh_protocolo %}<span class="badge text-bg-info">Recebe protocolos</span>{% endif %}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('setores.editar', id_setor=s.id_setor) }}">Editar</a>
        <form method="post" action="{{ url_for('setores.excluir', id_setor=s.id_setor) }}" class="d-inline"
              data-confirmar="Excluir o setor {{ s.sigla }}? Esta ação não pode ser desfeita.">
          <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
